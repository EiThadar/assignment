<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Area Unit Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f8ff;
      padding: 40px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background-color: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #007acc;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007acc;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #005f99;
    }
    #areaResult {
      margin-top: 20px;
      font-size: 18px;
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Area Unit Converter</h2>

    <label for="squareMeterInput">Enter area in square meters:</label>
    <input type="number" id="squareMeterInput" placeholder="e.g. 100" min="0" step="any">

    <label for="areaUnit">Convert to:</label>
    <select id="areaUnit">
      <option value="sqft">Square Feet</option>
      <option value="sqin">Square Inches</option>
      <option value="sqkm">Square Kilometers</option>
      <option value="acre">Acres</option>
      <option value="hectare">Hectares</option>
    </select>

    <button onclick="convertArea()">Convert</button>
    <button onclick="goBack()">Back</button>

    <p id="areaResult"></p>
  </div>

  <script>
    function convertArea() {
      const sqm = parseFloat(document.getElementById("squareMeterInput").value);
      const unit = document.getElementById("areaUnit").value;
      const resultElement = document.getElementById("areaResult");

      if (isNaN(sqm) || sqm <= 0) {
        resultElement.innerHTML = "❌ Please enter a valid positive number.";
        return;
      }

      let result = "";
      switch (unit) {
        case "sqft": result = (sqm * 10.7639).toFixed(2) + " square feet"; break;
        case "sqin": result = (sqm * 1550.0031).toFixed(2) + " square inches"; break;
        case "sqkm": result = (sqm / 1e6).toFixed(6) + " square kilometers"; break;
        case "acre": result = (sqm * 0.000247105).toFixed(5) + " acres"; break;
        case "hectare": result = (sqm * 0.0001).toFixed(4) + " hectares"; break;
      }

      resultElement.innerHTML = sqm + " sq.m = " + result;
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
